# Based on
# https://github.com/fedarko/strainFlye/blob/main/.github/workflows/main.yml,
# which was in turn "[based] roughly on the main.yml and standalone.yml 
# workflows in
# https://github.com/biocore/empress/blob/master/.github/workflows/,
# and on https://docs.github.com/en/actions/quickstart". It's copy-and-paste
# all the way down baybee
name: wotplot CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    # https://github.com/conda-incubator/setup-miniconda#use-a-default-shell
    # Use the same shell for all commands here, preserving the "context" of the
    # conda environment we set up. (This is a lot nicer-looking than prefixing
    # all of these commands with "conda run -n menv".)
    #
    # See https://stackoverflow.com/q/69070754 and 'bash -c "help set"' for details
    # about what the "-el {0}" means here.
    # ^^^ copied from metaLJA GH Actions workflow
    defaults:
      run:
        shell: bash -el {0}

    steps:

      # Updating from v2 to v3 to match, as of writing,
      # https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
      - name: Check out code
        uses: actions/checkout@v3

      # https://github.com/conda-incubator/setup-miniconda#example-3-other-options
      # From Qurro's "standalone-oldpython" GH Actions workflow
      - name: Set up a conda environment using Python ${{ matrix.python-version }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: wenv
          python-version: ${{ matrix.python-version }}

      - name: Sanity check echo python version
        run: python --version

      - name: Sanity check echo python location
        run: which python

      - name: Sanity check echo pip version
        run: pip --version

      - name: Sanity check echo pip location
        run: which pip

      - name: Install wotplot and pip dependencies
        run: pip install -e .[dev]

      - name: Lint and stylecheck
        run: make stylecheck

      - name: Run tests
        run: make test

      - name: Upload code coverage information to Codecov
        uses: codecov/codecov-action@v2
